# =============================================================================
# Production nginx config for the Faculty Management portal.
#
# Assumes:
#   - TLS certificates live in /etc/nginx/certs (mounted from the host)
#   - Backend container is reachable on the internal Docker network as
#     `backend:5000`.
#   - The frontend static files are NOT served by nginx directly in this
#     setup; the entire app is one Vite SPA. We serve the static SPA
#     files from the `backend` container's `/app/frontend/dist` directory
#     OR you can swap the `location /` block to a `try_files` pointing to
#     the frontend's build output. The simplest, most secure default is
#     to have the backend serve the SPA too.
# =============================================================================

# Docker DNS resolver — required for dynamic container IP resolution
resolver 127.0.0.11 valid=10s ipv6=off;

# Upstream — direct connection to the backend container
upstream faculty_backend {
    zone faculty_backend 64k;
    server backend:5000 resolve;
    keepalive 32;
    keepalive_requests 1000;
}

# Rate-limit zone. 10 MB is enough to hold ~160k IPv4 addresses' state.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Hide the nginx version
server_tokens off;

# Buffer / timeouts
client_max_body_size 25m;
client_body_buffer_size 128k;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;
client_body_timeout 60s;
client_header_timeout 60s;
send_timeout 60s;

# gzip on for text-ish content
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow ACME challenges (Let's Encrypt) over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (helmet on the backend sets some too; nginx is belt
    # and braces).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP is also set on the backend response; we don't double-set here to
    # avoid conflicts.

    # Limit connections per IP
    limit_conn conn_per_ip 50;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Proxy timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # Don't pass the Host header from the upstream through to the backend.

    # Pass real client IP for the backend's `req.ip` (with TRUST_PROXY=1).
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ------------------------------------------------------------------
    # Auth endpoints: tight rate limit
    # ------------------------------------------------------------------
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://faculty_backend;
    }

    # ------------------------------------------------------------------
    # All other API endpoints
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=240 nodelay;
        limit_req_status 429;

        proxy_pass http://faculty_backend;
    }

    # ------------------------------------------------------------------
    # Health check (used by container healthcheck)
    # ------------------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass http://faculty_backend;
    }

    # ------------------------------------------------------------------
    # Serve the SPA via the frontend container
    # ------------------------------------------------------------------
    location / {
        set $frontend_upstream http://frontend;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
